<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chef Lens</title>
<style>
:root{--bg:#000;--fg:#fff;--acc:#5dffb0;--warn:#ffd24a;--dim:#9a9a9a;--bad:#ff4d4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:14px 18px;box-sizing:border-box;max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;font-size:18px;font-weight:700;color:var(--acc)}
.bar{height:6px;background:#333;border-radius:3px;margin:8px 0 10px}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.main{flex:1;display:flex;align-items:center;overflow:hidden}
.main div{font-size:clamp(24px,7vw,36px);line-height:1.3;font-weight:600;width:100%;overflow-wrap:anywhere}
.list{font-size:clamp(20px,5.5vw,28px);line-height:1.5}
.sel{background:var(--fg);color:#000;border-radius:8px;padding:0 8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{border:2px solid var(--warn);color:var(--warn);border-radius:20px;padding:2px 10px;font-size:18px;font-weight:700}
.pill.d{background:var(--bad);border-color:var(--bad);color:#fff}
.foot{margin-top:8px;font-size:15px;color:var(--dim);text-align:center}
#alarm{position:fixed;inset:0;background:var(--bad);display:none;align-items:center;justify-content:center;text-align:center;font-size:clamp(30px,9vw,48px);font-weight:800;padding:20px;animation:f .6s infinite alternate}
@keyframes f{to{background:#900}}
#setup{position:fixed;inset:0;background:#111;display:none;padding:16px;box-sizing:border-box;overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#setup textarea,#setup input{width:100%;box-sizing:border-box;background:#000;color:#fff;border:1px solid #555;border-radius:8px;padding:8px;font:16px system-ui;margin-bottom:8px}
#setup textarea{height:45vh}
button{font:600 16px system-ui;background:var(--acc);color:#000;border:0;border-radius:8px;padding:10px 14px;margin-right:8px}
#gear{position:fixed;right:8px;bottom:8px;opacity:.35;background:none;color:#fff;font-size:20px;padding:4px 8px;margin:0}
</style></head><body>
<div id="app">
 <div class="top"><span id="a"></span><span id="b"></span></div>
 <div class="bar"><i id="p" style="width:0"></i></div>
 <div class="main"><div id="m"></div></div>
 <div class="pills" id="pl"></div>
 <div class="foot" id="f"></div>
</div>
<div id="alarm"></div>
<button id="gear" aria-label="Edit recipe">✎</button>
<div id="setup">
 <h2 style="margin:0 0 8px">Edit recipe</h2>
 <input id="ti" placeholder="Recipe name">
 <textarea id="src" placeholder="Paste recipe: ingredients, then numbered steps"></textarea>
 <button id="ok">Load</button><button id="x" style="background:#444;color:#fff">Close</button>
 <p style="color:#9a9a9a;font-size:13px">Saved in this browser only. A recipe loaded on your phone won’t appear on your glasses.</p>
</div>
<script>
const SAMPLE={t:"Garlic Butter Steak Bites",s:`Ingredients
1 lb sirloin steak, cubed
4 cloves garlic, minced
2 tbsp butter
1 cup green beans

1. Pat the steak dry and season generously with salt and pepper.
2. Heat oil in a large pan over medium-high heat. Add the steak and cook for 5 minutes, turning once, until browned.
3. Add the green beans and cook for 4 minutes until bright green and tender.
4. Lower the heat, add the butter and garlic, and stir for 1 minute until fragrant.
5. Plate the steak and beans, spoon over the garlic butter, and enjoy!`};
const $=i=>document.getElementById(i);
const PRE=["Beef to cook","Chicken to cook","Veggies to roast","Pasta to boil","Rice to simmer","Meat to rest"];
let title="",steps=[],ing=[],i=0,view="r",timers=[],nid=1,ti=0,lb=0,mins=5,alarmQ=[];
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function parse(t){const L=t.split("\n").map(s=>s.trim()),n=L.findIndex(l=>/^\d+[.)]\s/.test(l));
 ing=(n>0?L.slice(0,n):[]).filter(l=>l&&!/^ingredients$/i.test(l));
 let s=L.filter(l=>/^\d+[.)]\s/.test(l)).map(l=>l.replace(/^\d+[.)]\s*/,""));
 return s.length?s:L.filter(Boolean)}
function dur(s){const m=(s||"").match(/(\d+(?:\.\d+)?)(?:\s*(?:-|to)\s*\d+)?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)/i);
 if(!m)return 0;const n=+m[1],u=m[2][0].toLowerCase();return u==="h"?n*3600:u==="m"?n*60:n}
function lab(s){const f=(s.match(/\b(beef|steak|chicken|pork|salmon|shrimp|fish|rice|pasta|potatoes?|beans|veggies|vegetables|sauce|onions?|tofu)\b/i)||[])[1],
 v=(s.match(/\b(cook|bake|roast|simmer|boil|sear|rest|stir|toast|steam)\b/i)||[])[1];
 const x=f&&v?`${f} to ${v}`:s.split(" ").slice(0,3).join(" ");return x[0].toUpperCase()+x.slice(1).toLowerCase()}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function load(t,s){title=t;steps=parse(s);i=0;view="r";set("cl-t",t);set("cl-s",s);draw()}
function addT(l,sec){timers.push({id:nid++,l,end:Date.now()+sec*1000,d:0});draw()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(o=>{const g=c.createOscillator();g.connect(c.destination);g.frequency.value=900;g.start(c.currentTime+o);g.stop(c.currentTime+o+.18)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function draw(){
 const n=steps.length;$("a").textContent=view==="t"?"Timers":view==="i"?"Ingredients":title;
 $("b").textContent=view==="r"&&n?`${i+1}/${n}`:"";$("p").style.width=(n?(i+1)/n*100:0)+"%";
 let h="",ft="";
 if(view==="r"){h=`<div>${esc(steps[i]||"Open ✎ to load a recipe")}</div>`;const d=dur(steps[i]);
  ft=`◀ ▶ step  ·  ${d?`● start ${fmt(d)} timer`:"● no time here"}  ·  ▲ ingredients  ·  ▼ timers`}
 else if(view==="i"){h=`<div class="list">${ing.map(x=>"• "+esc(x)).join("<br>")||"No ingredients found"}</div>`;ft="▼ or ● back to step"}
 else{const rows=[`<div class="${ti===0?"sel":""}">＋ ${esc(PRE[lb])} · ${mins} min</div>`];
  timers.forEach((t,k)=>rows.push(`<div class="${ti===k+1?"sel":""}">${t.d?"✔":"⏱"} ${esc(t.l)} · ${t.d?"DONE":fmt((t.end-Date.now())/1000)}</div>`));
  h=`<div class="list">${rows.join("")}</div>`;
  ft=ti===0?"◀ ▶ label  ·  ▲ ▼ minutes  ·  ● start  ·  hold back to exit":"● cancel timer  ·  ▲ ▼ move"}
 $("m").innerHTML=h;
 $("pl").innerHTML=view==="t"?"":timers.map(t=>`<span class="pill ${t.d?"d":""}">${esc(t.l)} ${t.d?"DONE":fmt((t.end-Date.now())/1000)}</span>`).join("");
 $("f").textContent=ft}
function key(k){
 if($("alarm").style.display==="flex"){dismiss();return}
 if(k==="esc"){view="r";draw();return}
 if(view==="r"){
  if(k==="r"&&i<steps.length-1)i++;else if(k==="l"&&i>0)i--;
  else if(k==="u")view="i";else if(k==="d"){view="t";ti=0}
  else if(k==="ok"){const s=dur(steps[i]);if(s)addT(lab(steps[i]),s)}}
 else if(view==="i"){if(k==="d"||k==="ok"||k==="esc")view="r"}
 else{
  if(k==="d")ti=Math.min(timers.length,ti+1);else if(k==="u"){if(ti===0)mins=Math.min(180,mins+1);else ti--}
  else if(ti===0&&k==="l")lb=(lb+PRE.length-1)%PRE.length;else if(ti===0&&k==="r")lb=(lb+1)%PRE.length;
  else if(k==="ok"){if(ti===0){addT(PRE[lb],mins*60);view="r"}else{timers.splice(ti-1,1);ti=Math.min(ti,timers.length)}}}
 draw()}
function dismiss(){$("alarm").style.display="none";alarmQ.shift();if(alarmQ.length)showAlarm()}
function showAlarm(){$("alarm").innerHTML=`⏰<br>${esc(alarmQ[0])}<br>DONE`;$("alarm").style.display="flex";beep()}
setInterval(()=>{timers.forEach(t=>{if(!t.d&&Date.now()>=t.end){t.d=1;alarmQ.push(t.l);if($("alarm").style.display!=="flex")showAlarm()}});draw()},500);
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 const m={ArrowLeft:"l",ArrowRight:"r",ArrowUp:"u",ArrowDown:"d",Enter:"ok"," ":"ok",Escape:"esc",Backspace:"esc"}[e.key];if(m){e.preventDefault();key(m)}});
$("app").addEventListener("click",e=>{const r=$("app").getBoundingClientRect(),x=(e.clientX-r.left)/r.width;key(x<.28?"l":x>.72?"r":"ok")});
$("alarm").onclick=dismiss;
$("gear").onclick=()=>{$("ti").value=title;$("src").value=get("cl-s")||SAMPLE.s;$("setup").style.display="block"};
$("x").onclick=()=>$("setup").style.display="none";
$("ok").onclick=()=>{load($("ti").value||"Recipe",$("src").value);$("setup").style.display="none"};
try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
load(get("cl-t")||SAMPLE.t,get("cl-s")||SAMPLE.s);
</script></body></html>
